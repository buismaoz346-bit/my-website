<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Syed Maoz Arif</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a192f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #ccd6f6;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #64ffda, #4285f4, #34a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 16px;
        }
        .error-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            color: #e8eaed;
            margin-bottom: 12px;
        }
        .error-desc {
            color: #8892b0;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 450px;
        }
        .home-btn {
            display: inline-block;
            padding: 14px 36px;
            border: 2px solid #64ffda;
            color: #64ffda;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            background: transparent;
        }
        .home-btn:hover {
            background: rgba(100,255,218,0.1);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(100,255,218,0.15);
        }
        .circuit-line {
            position: fixed;
            background: rgba(100,255,218,0.05);
            border-radius: 2px;
        }
        .circuit-line:nth-child(1) { width: 200px; height: 2px; top: 20%; left: 5%; transform: rotate(15deg); }
        .circuit-line:nth-child(2) { width: 150px; height: 2px; top: 60%; right: 10%; transform: rotate(-20deg); }
        .circuit-line:nth-child(3) { width: 2px; height: 180px; top: 30%; left: 15%; }
        .circuit-line:nth-child(4) { width: 2px; height: 120px; bottom: 20%; right: 20%; }
    </style>
</head>
<body>
    <div class="circuit-line"></div>
    <div class="circuit-line"></div>
    <div class="circuit-line"></div>
    <div class="circuit-line"></div>
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">Circuit Not Found</h1>
        <p class="error-desc">Looks like this page doesn't exist in Maoz's schematic. The trace you followed leads to an open circuit!</p>
        <a href="/" class="home-btn">← Back to Portfolio</a>
    </div>
</body>
</html>
